name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OUT: teams-cocaine.exe
  SRC: teams-cocaine.ahk

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      ahk_version: ${{ steps.install.outputs.ahk_version }}
      ahk2exe_version: ${{ steps.install.outputs.ahk2exe_version }}
      runner_image: ${{ steps.install.outputs.runner_image }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      # Fail in seconds rather than after a full build when the tag is mislabeled.
      - name: Check tag against SetVersion
        if: github.ref_type == 'tag'
        run: |
          $ver = (Select-String -Path $env:SRC -Pattern '^;@Ahk2Exe-SetVersion\s+(\S+)').Matches[0].Groups[1].Value
          if ("v$ver" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match ;@Ahk2Exe-SetVersion $ver" }

      # Same two sources the AutoHotkey Dash uses on a desktop: winget for the v2
      # interpreter and the newest Ahk2Exe release from GitHub (the v2 installer does
      # not ship the compiler). Machine scope lands in C:\Program Files\AutoHotkey,
      # the layout build.cmd expects.
      - name: Install latest AutoHotkey v2 and Ahk2Exe
        id: install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          winget install --id AutoHotkey.AutoHotkey --exact --source winget --scope machine --silent `
              --accept-source-agreements --accept-package-agreements --disable-interactivity

          $ahkDir = "C:\Program Files\AutoHotkey"
          $dl = "$env:RUNNER_TEMP\ahk2exe"
          gh release download -R AutoHotkey/Ahk2Exe --pattern "*.zip" -D $dl
          Expand-Archive -Path "$dl\*.zip" -DestinationPath $dl -Force
          $ahk2exe = Get-ChildItem $dl -Recurse -Filter Ahk2Exe.exe | Select-Object -First 1
          if (-not $ahk2exe) { throw "Ahk2Exe.exe not found in the Ahk2Exe release zip" }
          New-Item -ItemType Directory -Force "$ahkDir\Compiler" | Out-Null
          Copy-Item $ahk2exe.FullName "$ahkDir\Compiler\Ahk2Exe.exe"

          foreach ($f in "$ahkDir\v2\AutoHotkey64.exe", "$ahkDir\Compiler\Ahk2Exe.exe") {
              if (-not (Test-Path $f)) { throw "$f is missing" }
          }
          $ahkVer = (Get-Item "$ahkDir\v2\AutoHotkey64.exe").VersionInfo.ProductVersion
          $ahk2exeVer = (Get-Item "$ahkDir\Compiler\Ahk2Exe.exe").VersionInfo.FileVersion
          "AutoHotkey $ahkVer, Ahk2Exe $ahk2exeVer"
          "ahk_version=$ahkVer" >> $env:GITHUB_OUTPUT
          "ahk2exe_version=$ahk2exeVer" >> $env:GITHUB_OUTPUT
          "runner_image=$env:ImageOS $env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Build
        run: ./build.cmd

      # sha256sum format (LF, two spaces) so "sha256sum -c SHA256SUMS" works as is.
      - name: Checksum
        id: checksum
        run: |
          $lines = Get-FileHash $env:OUT, $env:SRC -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + "  " + (Split-Path $_.Path -Leaf) }
          Set-Content -Path SHA256SUMS -Value (($lines -join "`n") + "`n") -Encoding ascii -NoNewline
          $sha256 = $lines[0].Split(" ")[0]
          Get-Content SHA256SUMS
          "sha256=$sha256" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUT }}
          path: |
            ${{ env.OUT }}
            SHA256SUMS
          if-no-files-found: error

  # Early warning when a new interpreter or Ahk2Exe build starts tripping scanners.
  # Public VirusTotal API: 4 requests/min, 500/day, and uploads are visible to everyone.
  # Reports only: a detection never fails the run, and neither does a VT outage.
  virustotal:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUT }}

      - name: Scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${VT_API_KEY:-}" ]; then echo "VT_API_KEY secret is not set, skipping."; exit 0; fi
          api=https://www.virustotal.com/api/v3
          report="https://www.virustotal.com/gui/file/$SHA256"
          vt() { curl -sS --fail -H "x-apikey: $VT_API_KEY" "$@"; }
          echo "::notice::VirusTotal report (updates live while the scan runs): $report"

          # A byte-identical file (e.g. a rerun) is already known: reuse its verdict instead of
          # queueing a re-analysis, which VT deprioritises and which can take far longer.
          if known=$(vt "$api/files/$SHA256" 2>/dev/null); then
              echo "File already known to VirusTotal, using its last analysis."
              stats=$(jq .data.attributes.last_analysis_stats <<<"$known")
              results=$(jq .data.attributes.last_analysis_results <<<"$known")
          else
              id=$(vt -F "file=@$OUT" "$api/files" | jq -r .data.id)
              status=queued
              for _ in $(seq 15); do
                  sleep 20
                  analysis=$(vt "$api/analyses/$id")
                  status=$(jq -r .data.attributes.status <<<"$analysis")
                  [ "$status" = completed ] && break
              done
              if [ "$status" != completed ]; then
                  echo "::notice::Analysis still $status after 5 min, not waiting any longer: $report"
                  exit 0
              fi
              stats=$(jq .data.attributes.stats <<<"$analysis")
              results=$(jq .data.attributes.results <<<"$analysis")
          fi

          malicious=$(jq .malicious <<<"$stats")
          suspicious=$(jq .suspicious <<<"$stats")
          undetected=$(jq .undetected <<<"$stats")
          {
              echo "### VirusTotal: $malicious malicious, $suspicious suspicious, $undetected clean"
              echo
              echo "$report"
              echo
              jq -r '.[] | select(.category == "malicious" or .category == "suspicious")
                     | "- \(.engine_name): \(.result)"' <<<"$results"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$malicious" -gt 0 ] || [ "$suspicious" -gt 0 ]; then
              echo "::warning::VirusTotal flagged $OUT ($malicious malicious, $suspicious suspicious): $report"
          fi

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Same check as in build, repeated so a release can never ship mislabeled.
      - name: Check tag against SetVersion
        run: |
          set -euo pipefail
          ver=$(grep -m1 '^;@Ahk2Exe-SetVersion ' "$SRC" | awk '{print $2}' | tr -d '\r')
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match ;@Ahk2Exe-SetVersion $ver"; exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUT }}

      # Prepended to the auto-generated changelog by "gh release create --generate-notes".
      # The VirusTotal report URL is derived from the hash, so the scan job need not finish first.
      - name: Release notes
        env:
          VT_CONFIGURED: ${{ secrets.VT_API_KEY != '' }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          AHK_VERSION: ${{ needs.build.outputs.ahk_version }}
          AHK2EXE_VERSION: ${{ needs.build.outputs.ahk2exe_version }}
          RUNNER_IMAGE: ${{ needs.build.outputs.runner_image }}
        run: |
          set -euo pipefail
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if [ "$VT_CONFIGURED" = true ]; then vt="[report](https://www.virustotal.com/gui/file/$SHA256)"; else vt="not scanned"; fi
          cat > RELEASE_NOTES.md <<NOTES
          Download \`$OUT\` and run it. If AutoHotkey v2 is installed you can run \`$SRC\` directly instead.

          ## Build

          Built from [\`${GITHUB_SHA:0:12}\`]($repo/commit/$GITHUB_SHA) by [workflow run $GITHUB_RUN_NUMBER]($repo/actions/runs/$GITHUB_RUN_ID).

          - AutoHotkey: $AHK_VERSION
          - Ahk2Exe: $AHK2EXE_VERSION
          - Runner image: $RUNNER_IMAGE
          - VirusTotal: $vt
          - SHA-256: \`$SHA256\`

          Verify the download with \`sha256sum -c SHA256SUMS\`.

          NOTES
          cat RELEASE_NOTES.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$OUT" "$SRC" SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --generate-notes
