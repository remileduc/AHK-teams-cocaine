name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  OUT: teams-cocaine.exe

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Same two sources the AutoHotkey Dash uses on a desktop: winget for the v2
      # interpreter and the newest Ahk2Exe release from GitHub (the v2 installer does
      # not ship the compiler). Machine scope lands in C:\Program Files\AutoHotkey,
      # the layout build.cmd expects.
      - name: Install latest AutoHotkey v2 and Ahk2Exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          winget install --id AutoHotkey.AutoHotkey --exact --source winget --scope machine --silent `
              --accept-source-agreements --accept-package-agreements --disable-interactivity

          $ahkDir = "C:\Program Files\AutoHotkey"
          $dl = "$env:RUNNER_TEMP\ahk2exe"
          gh release download -R AutoHotkey/Ahk2Exe --pattern "*.zip" -D $dl
          Expand-Archive -Path "$dl\*.zip" -DestinationPath $dl -Force
          $ahk2exe = Get-ChildItem $dl -Recurse -Filter Ahk2Exe.exe | Select-Object -First 1
          if (-not $ahk2exe) { throw "Ahk2Exe.exe not found in the Ahk2Exe release zip" }
          New-Item -ItemType Directory -Force "$ahkDir\Compiler" | Out-Null
          Copy-Item $ahk2exe.FullName "$ahkDir\Compiler\Ahk2Exe.exe"

          foreach ($f in "$ahkDir\v2\AutoHotkey64.exe", "$ahkDir\Compiler\Ahk2Exe.exe") {
              if (-not (Test-Path $f)) { throw "$f is missing" }
          }
          $ahkVer = (Get-Item "$ahkDir\v2\AutoHotkey64.exe").VersionInfo.ProductVersion
          $ahk2exeVer = (Get-Item "$ahkDir\Compiler\Ahk2Exe.exe").VersionInfo.FileVersion
          "AutoHotkey $ahkVer, Ahk2Exe $ahk2exeVer"
          "AHK_VERSION=$ahkVer" >> $env:GITHUB_ENV
          "AHK2EXE_VERSION=$ahk2exeVer" >> $env:GITHUB_ENV

      - name: Build
        run: ./build.cmd

      # sha256sum format (LF, two spaces) so "sha256sum -c SHA256SUMS" works as is.
      - name: Checksum
        run: |
          $line = (Get-FileHash $env:OUT -Algorithm SHA256).Hash.ToLower() + "  " + $env:OUT
          Set-Content -Path SHA256SUMS -Value "$line`n" -Encoding ascii -NoNewline
          Get-Content SHA256SUMS

      # Early warning when a new interpreter or Ahk2Exe build starts tripping scanners.
      # Public VirusTotal API: 4 requests/min, 500/day, and uploads are visible to everyone.
      # Reports only; a detection never fails the build, and neither does a VT outage.
      - name: VirusTotal scan
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if (-not $env:VT_API_KEY) { "VT_API_KEY secret is not set, skipping."; exit 0 }
          $headers = @{ 'x-apikey' = $env:VT_API_KEY }
          $sha256 = (Get-FileHash $env:OUT -Algorithm SHA256).Hash.ToLower()
          $report = "https://www.virustotal.com/gui/file/$sha256"

          $upload = Invoke-RestMethod -Method Post -Uri https://www.virustotal.com/api/v3/files `
              -Headers $headers -Form @{ file = Get-Item $env:OUT }
          "VT_REPORT=$report" >> $env:GITHUB_ENV
          $deadline = (Get-Date).AddMinutes(10)
          do {
              Start-Sleep -Seconds 20
              $analysis = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$($upload.data.id)" -Headers $headers
          } while ($analysis.data.attributes.status -ne 'completed' -and (Get-Date) -lt $deadline)
          if ($analysis.data.attributes.status -ne 'completed') { throw "Analysis still $($analysis.data.attributes.status) after 10 min: $report" }

          $stats = $analysis.data.attributes.stats
          $flagged = $analysis.data.attributes.results.PSObject.Properties.Value |
              Where-Object { $_.category -in 'malicious', 'suspicious' } |
              ForEach-Object { "- $($_.engine_name): $($_.result)" }
          $summary = @(
              "### VirusTotal: $($stats.malicious) malicious, $($stats.suspicious) suspicious, $($stats.undetected) clean"
              ""
              $report
              ""
          ) + $flagged
          $summary | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          $summary
          if ($stats.malicious -gt 0 -or $stats.suspicious -gt 0) {
              "::warning::VirusTotal flagged $env:OUT ($($stats.malicious) malicious, $($stats.suspicious) suspicious): $report"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUT }}
          path: |
            ${{ env.OUT }}
            SHA256SUMS
          if-no-files-found: error

      # Prepended to the auto-generated changelog by "gh release create --generate-notes".
      - name: Release notes
        if: github.ref_type == 'tag'
        run: |
          $sha256 = (Get-FileHash $env:OUT -Algorithm SHA256).Hash.ToLower()
          $repo = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $vt = if ($env:VT_REPORT) { "[report]($env:VT_REPORT)" } else { "not scanned" }
          @"
          ## Build

          Built from [``$($env:GITHUB_SHA.Substring(0, 12))``]($repo/commit/$env:GITHUB_SHA) by [workflow run $env:GITHUB_RUN_NUMBER]($repo/actions/runs/$env:GITHUB_RUN_ID).

          - AutoHotkey: $env:AHK_VERSION
          - Ahk2Exe: $env:AHK2EXE_VERSION
          - Runner image: $env:ImageOS $env:ImageVersion
          - VirusTotal: $vt
          - SHA-256: ``$sha256``

          Verify the download with ``sha256sum -c SHA256SUMS``.

          "@ | Set-Content -Path RELEASE_NOTES.md -Encoding utf8
          Get-Content RELEASE_NOTES.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        if: github.ref_type == 'tag'
        run: |
          # The tag must match the version baked into the exe, or the release would lie.
          $ver = (Select-String -Path teams-cocaine.ahk -Pattern '^;@Ahk2Exe-SetVersion\s+(\S+)').Matches[0].Groups[1].Value
          if ("v$ver" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match ;@Ahk2Exe-SetVersion $ver" }
          gh release create $env:GITHUB_REF_NAME $env:OUT SHA256SUMS --title $env:GITHUB_REF_NAME --notes-file RELEASE_NOTES.md --generate-notes
